<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">  
  <link rel='stylesheet' href='./css/style.css'>  
  <title>Article Preview Component</title>
  <script src='./js/main.js' defer></script>
</head>
<body>

  <div class='container'>
    <img class='article-image' src='./assets/images/drawers.jpg' alt='Green dresser with tan vase'>
    <main>
      <div class='text-block'>
        <h1>
          Shift the overall look and feel by adding these wonderful
          touches to furniture in your home
        </h1>
        <p>
          Ever been in a room and felt like something was missing? Perhaps
          it felt slightly bare and uninviting. I’ve got some simple tips
          to help you make any room feel complete.
        </p>
      </div>
    
      <div class='button-group'>
        <div class='profile'>
          <img class='avatar' src='./assets/images/avatar-michelle.jpg' alt=''>
          <div class='profile-name-block'>
            <p class='name'>Michelle Appleton</p>
            <p class='date'>28 Jun 2020</p>
          </div>
        </div>
        <div class='share-button dark-button'>
          <img src='./assets/images/icon-share.svg' alt=''>
        </div>
      </div>
    </main>
